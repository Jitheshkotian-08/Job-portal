<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job — Sourced</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container main-content">
    <div class="page-header">
        <span class="eyebrow">Recruiter tools</span>
        <h1 id="pageTitle">Post a job</h1>
    </div>

    <div class="card form-card">
        <div id="formAlert" class="alert alert-error"></div>

        <form id="jobForm">
            <div class="field">
                <label for="titleInput">Job title</label>
                <input type="text" id="titleInput" required placeholder="e.g. Backend Developer">
            </div>

            <div class="field">
                <label for="descriptionInput">Description</label>
                <textarea id="descriptionInput" required placeholder="Describe the role, responsibilities, and what you're looking for..."></textarea>
            </div>

            <div class="field">
                <label for="skillsInput">Required skills</label>
                <input type="text" id="skillsInput" placeholder="Java, Spring Boot, MySQL (comma-separated)">
            </div>

            <div class="form-row">
                <div class="field">
                    <label for="locationInput">Location</label>
                    <input type="text" id="locationInput" required placeholder="e.g. Bangalore">
                </div>
                <div class="field">
                    <label for="jobTypeInput">Job type</label>
                    <select id="jobTypeInput" required>
                        <option value="FULL_TIME">Full-time</option>
                        <option value="PART_TIME">Part-time</option>
                        <option value="INTERNSHIP">Internship</option>
                        <option value="CONTRACT">Contract</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="field">
                    <label for="salaryInput">Annual salary (₹)</label>
                    <input type="number" id="salaryInput" min="0" placeholder="800000">
                </div>
                <div class="field">
                    <label for="deadlineInput">Application deadline</label>
                    <input type="date" id="deadlineInput" required>
                </div>
            </div>

            <div class="flex-gap">
                <button type="submit" class="btn btn-primary" id="submitBtn">Post job</button>
                <a href="recruiter-jobs.html" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/navbar.js"></script>
<script src="js/post-job.js"></script>
</body>
</html>
