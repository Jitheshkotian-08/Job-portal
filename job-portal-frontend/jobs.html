<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs — Sourced</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container main-content">
    <div class="page-header">
        <span class="eyebrow">Browse opportunities</span>
        <h1>Find your next role</h1>
    </div>

    <div class="filter-bar">
        <input type="text" id="keywordInput" placeholder="Search by title, skill, or keyword...">
        <input type="text" id="locationInput" placeholder="Location">
        <select id="jobTypeInput">
            <option value="">All job types</option>
            <option value="FULL_TIME">Full-time</option>
            <option value="PART_TIME">Part-time</option>
            <option value="INTERNSHIP">Internship</option>
            <option value="CONTRACT">Contract</option>
        </select>
        <button class="btn btn-primary" id="searchBtn">Search</button>
    </div>

    <div id="resultsCount" class="text-muted text-small mb-16"></div>
    <div id="jobGrid" class="job-grid"></div>
    <div id="emptyState" class="empty-state" style="display:none;">
        <h3>No jobs found</h3>
        <p>Try adjusting your search or filters.</p>
    </div>

    <div id="pagination" class="pagination"></div>
</div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/navbar.js"></script>
<script src="js/jobs.js"></script>
</body>
</html>
