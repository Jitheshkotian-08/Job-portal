<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Sourced</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
    <div class="auth-brand-panel">
        <div class="brand-mark">Sourced.</div>
        <div class="brand-quote">Where roles <span>find</span> the right people — not the other way around.</div>
        <div class="brand-foot">Job Portal & Recruitment System</div>
    </div>

    <div class="auth-form-panel">
        <div class="auth-form-box">
            <span class="eyebrow">Welcome back</span>
            <h1>Log in</h1>
            <p class="subhead">Enter your details to access your account.</p>

            <div id="loginAlert" class="alert alert-error"></div>

            <form id="loginForm">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log in</button>
            </form>

            <div class="auth-switch">
                Don't have an account? <a href="register.html">Create one</a>
            </div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
